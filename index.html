<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10X Shop</title>
    <meta name="description" content="10X Shop — online store with products from DummyJSON." />
    <script>
      // თემა React-ის ჩატვირთვამდე ირთვება — ასე გვერდი არ "ციმციმებს"
      try {
        var saved = localStorage.getItem("shop_theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
